name: Create EC2 Instance (using secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Create EC2 instance (aws cli)
        id: create-ec2
        env:
          AMI: 'ami-918734735613'
          INSTANCE_TYPE: 't2.micro'
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

        run: |
          set -euo pipefail
          echo "Using AMI: $AMI"
          echo "Instance type: $INSTANCE_TYPE"
          echo "Region: $AWS_REGION"

          ARGS=(--image-id "$AMI" --count 1 --instance-type "$INSTANCE_TYPE" --region "$AWS_REGION")

          if [ -n "$KEY_NAME" ]; then
            ARGS+=(--key-name "$KEY_NAME")
          fi

          if [ -n "$SUBNET_ID" ]; then
            ARGS+=(--subnet-id "$SUBNET_ID")
          fi

          if [ -n "$SG_IDS" ]; then
            IFS=',' read -ra SG_ARR <<< "$SG_IDS"
            for sg in "${SG_ARR[@]}"; do
              ARGS+=(--security-group-ids "$sg")
            done
          fi

          ARGS+=(--tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=github-actions-ec2}]')

          echo "Running: aws ec2 run-instances ..."
          INSTANCE_ID=$(aws ec2 run-instances "${ARGS[@]}" --query 'Instances[0].InstanceId' --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Failed to create instance or no instance id returned"
            exit 1
          fi

          echo "Created instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance to be running
        if: always()
        run: |
          if [ -n "${{ steps.create-ec2.outputs.instance_id || '' }}" ]; then
            INSTANCE_ID=${{ steps.create-ec2.outputs.instance_id }}
          else
            echo "No instance id available from previous step outputs; skipping wait"
            exit 0
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "${{ vars.AWS_REGION || 'ap-south-1' }}" || true
